<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | StudentHub</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/register.css">
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <header class="navbar">

        <div class="logo">
            <img src="../imsges/logo.png" alt="StudentHub Logo">
            <span>StudentHub</span>
        </div>

        <nav>
            <a href="../index.html">Home</a>
            <a href="about.html">About</a>
            <a href="events.html">Events</a>
            <a href="notices.html">Notices</a>
            <a href="contact.html">Contact</a>
        </nav>

        <div class="nav-buttons">

            <button id="themeToggle" class="theme-btn">
                🌙 Dark
            </button>

            <a href="login.html" class="btn btn-light">
                Login
            </a>

        </div>

    </header>


    <!-- ================= REGISTER ================= -->

    <main class="register-page">

        <div class="register-header">

            <p>STUDENTHUB</p>

            <h1>Create Your Account</h1>

            <span>
                Register as a Student or Teacher to access StudentHub.
            </span>

        </div>


        <form id="registrationForm" novalidate>

            <!-- ================= ROLE ================= -->

            <div class="role-selection">

                <label class="role-title">
                    Register As
                </label>

                <div class="role-options">

                    <label class="role-option">

                        <input
                            type="radio"
                            name="role"
                            value="student"
                            checked
                        >

                        <span>
                            🎓 Student
                        </span>

                    </label>


                    <label class="role-option">

                        <input
                            type="radio"
                            name="role"
                            value="teacher"
                        >

                        <span>
                            👨‍🏫 Teacher
                        </span>

                    </label>

                </div>

            </div>


            <!-- ================= NAME ================= -->

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    required
                >

                <small id="nameError" class="error"></small>

            </div>


            <!-- ================= EMAIL ================= -->

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="example@gmail.com"
                    autocomplete="email"
                    required
                >

                <small id="emailError" class="error"></small>

            </div>


            <!-- ================= MOBILE ================= -->

            <div class="form-group">

                <label for="mobile">
                    Mobile Number
                </label>

                <input
                    type="tel"
                    id="mobile"
                    placeholder="Enter 10 digit mobile number"
                    maxlength="10"
                    autocomplete="tel"
                    required
                >

                <small id="mobileError" class="error"></small>

            </div>


            <!-- ================= STUDENT FIELDS ================= -->

            <div id="studentFields">

                <div class="form-row">

                    <!-- COURSE -->

                    <div class="form-group">

                        <label for="course">
                            Course
                        </label>

                        <select id="course">

                            <option value="">
                                Select Course
                            </option>

                            <option value="B.Tech IT">
                                B.Tech IT
                            </option>

                            <option value="B.Tech CSE">
                                B.Tech CSE
                            </option>

                            <option value="B.Tech CE">
                                B.Tech CE
                            </option>

                            <option value="B.Tech ECE">
                                B.Tech ECE
                            </option>

                        </select>

                        <small id="courseError" class="error"></small>

                    </div>


                    <!-- YEAR -->

                    <div class="form-group">

                        <label for="year">
                            Year
                        </label>

                        <select id="year">

                            <option value="">
                                Select Year
                            </option>

                            <option value="1st Year">
                                1st Year
                            </option>

                            <option value="2nd Year">
                                2nd Year
                            </option>

                            <option value="3rd Year">
                                3rd Year
                            </option>

                            <option value="4th Year">
                                4th Year
                            </option>

                        </select>

                        <small id="yearError" class="error"></small>

                    </div>

                </div>

            </div>


            <!-- ================= TEACHER FIELDS ================= -->

            <div id="teacherFields" class="hidden">

                <div class="form-row">

                    <!-- DEPARTMENT -->

                    <div class="form-group">

                        <label for="department">
                            Department
                        </label>

                        <select id="department">

                            <option value="">
                                Select Department
                            </option>

                            <option value="Information Technology">
                                Information Technology
                            </option>

                            <option value="Computer Engineering">
                                Computer Engineering
                            </option>

                            <option value="Computer Science">
                                Computer Science
                            </option>

                            <option value="Electronics">
                                Electronics
                            </option>

                        </select>

                        <small id="departmentError" class="error"></small>

                    </div>


                    <!-- QUALIFICATION -->

                    <div class="form-group">

                        <label for="qualification">
                            Qualification
                        </label>

                        <select id="qualification">

                            <option value="">
                                Select Qualification
                            </option>

                            <option value="B.Tech">
                                B.Tech
                            </option>

                            <option value="M.Tech">
                                M.Tech
                            </option>

                            <option value="MCA">
                                MCA
                            </option>

                            <option value="Ph.D">
                                Ph.D
                            </option>

                        </select>

                        <small id="qualificationError" class="error"></small>

                    </div>

                </div>

            </div>


            <!-- ================= GENDER ================= -->

            <fieldset class="gender-box">

                <legend>
                    Gender
                </legend>

                <div class="gender-options">

                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="Male"
                        >
                        Male
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="Female"
                        >
                        Female
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="Other"
                        >
                        Other
                    </label>

                </div>

                <small id="genderError" class="error"></small>

            </fieldset>


            <!-- ================= PASSWORD ================= -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a strong password"
                    autocomplete="new-password"
                    required
                >

                <div class="strength-bar">
                    <div id="strengthFill"></div>
                </div>

                <small id="passwordStrength">
                    Password strength: Not entered
                </small>

                <small id="passwordError" class="error"></small>

            </div>


            <!-- ================= CONFIRM PASSWORD ================= -->

            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Re-enter your password"
                    autocomplete="new-password"
                    required
                >

                <small
                    id="confirmPasswordError"
                    class="error"
                ></small>

            </div>


            <!-- ================= TERMS ================= -->

            <div class="terms-box">

                <label>

                    <input
                        type="checkbox"
                        id="terms"
                        required
                    >

                    <span>
                        I agree to the Terms & Conditions
                    </span>

                </label>

                <small id="termsError" class="error"></small>

            </div>


            <!-- ================= BUTTON ================= -->

            <button
                type="submit"
                class="register-btn"
            >
                Create Account
            </button>


            <p class="login-text">

                Already have an account?

                <a href="login.html">
                    Login here
                </a>

            </p>

        </form>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer>

        <p>
            © 2026 StudentHub. All rights reserved.
        </p>

    </footer>


    <script src="../js/theme.js"></script>
    <script src="../js/register.js"></script>

</body>

</html>
